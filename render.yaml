version: "1"
services:
  - type: web
    name: electronicservis-api
    runtime: node
    repo: https://github.com/Armando823/Sistema-de-Gestion
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: MAIL_DRY_RUN
        value: "true"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: customer_login_otp
      - key: WHATSAPP_ORDER_TEMPLATE
        value: repair_order_code
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: es
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BUSINESS_NAME
        value: "Taller Digital"
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MYSQL_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: electronicservis-web
    runtime: static
    repo: https://github.com/Armando823/Sistema-de-Gestion
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
