version: "1"
projects:
- name: Prueva
  environments:
  - name: Production
    services:
    - type: web
      name: electronicservis-api
      runtime: docker
      repo: https://github.com/Armando823/Sistema-de-Gestion
      plan: free
      envVars:
      - key: BUSINESS_NAME
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: MAIL_DRY_RUN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NODE_ENV
        sync: false
      region: virginia
      dockerCommand: sh -c "node src/migrate.js && node src/index.js"
      dockerContext: .
      dockerfilePath: ./Dockerfile
      autoDeployTrigger: commit
      rootDir: server/
