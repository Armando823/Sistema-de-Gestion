name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sistema_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sistema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # --ignore-scripts: las pruebas no necesitan compilar better-sqlite3.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm --prefix server ci
      - run: npm --prefix server run test:integration
      - run: npm --prefix frontend ci
      - name: Compilar versión administrador
        run: npm --prefix frontend run build:admin
      - name: Compilar versión cliente
        run: npm --prefix frontend run build:client
      - name: Compilar versión web para Render
        run: npm --prefix frontend run build:web
      - name: Verificar que no hay credenciales de prueba en los builds
        run: |
          if grep -rq "Admin123" frontend/dist; then
            echo "Se encontró una contraseña de prueba en el build"; exit 1
          fi
